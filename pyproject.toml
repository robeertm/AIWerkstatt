# Single source of truth for the version. The release pipeline reads this file
# and requires a matching `## X.Y.Z` section in CHANGELOG.md before tagging.
[project]
name = "aiwerkstatt"
version = "0.13.0"
description = "Self-hosted AI app workshop — talk to a coding agent, watch it build and deploy live web apps. One docker compose up, any AI provider."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/robeertm/AIWerkstatt"
Source = "https://github.com/robeertm/AIWerkstatt"
Issues = "https://github.com/robeertm/AIWerkstatt/issues"

# Pinned Claude CLI shipped in the agent-runner image. The backend reads it for the
# User-Agent it sends; agent-runner/Dockerfile must carry the same value (CI checks this).
[tool.aiwerkstatt]
claude_cli = "2.1.310"
