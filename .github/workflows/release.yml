name: Release

# Tagging vX.Y.Z publishes a source archive as a GitHub release. The version in
# pyproject.toml and a matching `## X.Y.Z` CHANGELOG section are the source of
# truth (see docs/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leak scan (fail-closed before publishing)
        run: python backend/scrub/scan.py .

      - name: Build source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="aiwerkstatt-${VERSION}/" -o "aiwerkstatt-${VERSION}.tar.gz" HEAD

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## ${VERSION}/{f=1;next} /^## /{f=0} f" CHANGELOG.md > RELEASE_NOTES.md || true
          [ -s RELEASE_NOTES.md ] || echo "Release ${VERSION}" > RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: aiwerkstatt-*.tar.gz
          # 🔴 ALS VORABFASSUNG, NICHT ALS „latest" (04.10.2026).
          #
          # Das README schickt jeden neuen Benutzer auf
          # `releases/latest` — ein Tag-Push war damit sofort das, was
          # Fremde herunterladen. Geprueft worden war nur der
          # Arbeitsstand: der Leck-Scan laeuft oben auf dem Checkout, das
          # ARCHIV selbst hat niemand aufgemacht.
          #
          # Am 04.10.2026 ging bei DocuSort auf diesem Muster eine
          # Fassung an Roberts Kunden, die nicht startete. Robert hat
          # daraus eine stehende Anweisung gemacht, fuer saemtliche
          # oeffentlichen Repos: niemals eine ungepruefte Fassung
          # ausliefern.
          #
          # Jetzt legt der Tag-Push eine Vorabfassung ab — die laesst
          # `releases/latest` aus, der README-Verweis zeigt also weiter
          # auf die alte. `promote.yml` packt das VEROEFFENTLICHTE Archiv
          # aus, liest es nach und macht es erst dann regulaer.
          make_latest: "false"
          prerelease: true
