# Turns a pre-release into the regular ("latest") release, but only after the
# PUBLISHED archive has been downloaded, unpacked and checked. Triggered by hand.
#
# Why this step exists
#
# A tag push used to mark its release as "latest" right away, and the README
# sends every new user exactly there. Before that, only the leak scan had
# checked anything — and it scanned the checkout, not the archive that is
# actually offered for download. A release that has not been checked as the
# artifact users receive must never become "latest".
#
# Order:
#   1. tag push     ->  release is created as a PRE-RELEASE. `releases/latest`
#                       still points to the previous one, so the README target
#                       stays intact.
#   2. this step    ->  the published `aiwerkstatt-<v>.tar.gz` is downloaded,
#                       unpacked, its version checked, compiled and scanned for
#                       leaks once more — on the ARTIFACT, not the working tree.
#   3. only then    ->  the release becomes regular and "latest".
name: Promote to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, e.g. 0.11.0 (without v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and check the published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          TAG="v$V"
          ARCHIVE="aiwerkstatt-${V}.tar.gz"
          mkdir -p check && cd check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE"
          ls -l "$ARCHIVE"

          failed=0
          rm -rf out && mkdir out
          if ! tar xzf "$ARCHIVE" -C out; then
            echo "  🔴 cannot be unpacked"
            exit 1
          fi
          TREE="out/aiwerkstatt-${V}"
          if [ ! -d "$TREE" ]; then
            echo "  🔴 the archive has no directory aiwerkstatt-${V}"
            ls out
            exit 1
          fi
          echo "  OK  unpacked to $TREE"

          # The version inside must be the version on the label.
          inside="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$TREE/pyproject.toml" | head -1)"
          if [ "$inside" = "$V" ]; then
            echo "  OK  it really is $V"
          else
            echo "  🔴 inside: ${inside:-nothing}, label: $V"
            failed=1
          fi

          # A syntax error breaks every installation on first start —
          # and would otherwise only show up on a user's machine.
          if python3 -m compileall -q "$TREE/backend" > /tmp/compile.log 2>&1; then
            echo "  OK  the backend compiles"
          else
            echo "  🔴 does not compile:"
            tail -20 /tmp/compile.log
            failed=1
          fi

          # The leak scan once more, on the UNPACKED ARCHIVE. The build scans
          # the checkout — that is not the same set of files. What
          # `git archive` really included is only visible here.
          if ( cd "$TREE" && python3 backend/scrub/scan.py . ); then
            echo "  OK  no leak in the published archive"
          else
            echo "  🔴 the leak scan found something IN THE ARCHIVE"
            failed=1
          fi

          if [ "$failed" != "0" ]; then
            echo "🔴 DO NOT PROMOTE"
            exit 1
          fi
          echo "✅ the published archive is sound"

      - name: Make the release regular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "::notice::$TAG is now the regular release"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft

          # Verify through the door everyone else uses: `releases/latest` —
          # the endpoint the app's update check queries. (`gh release view
          # --json isLatest` is not available in the runner's gh.)
          points="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          echo "releases/latest points to: $points"
          if [ "$points" != "$TAG" ]; then
            echo "::error::releases/latest points to $points, not to $TAG."
            exit 1
          fi
          echo "✅ releases/latest points to $TAG"
