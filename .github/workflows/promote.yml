# Macht ein Release regulaer, nachdem das VEROEFFENTLICHTE Archiv aufgemacht und
# nachgelesen wurde. Von Hand ausgeloest.
#
# 🔴 WARUM ES DIESEN SCHRITT GIBT (04.10.2026)
#
# `release.yml` markierte jeden Tag-Push als „latest", und das README schickt
# jeden neuen Benutzer genau dorthin. Geprueft hatte vorher nur der Leck-Scan
# etwas — und zwar den Checkout, nicht das Archiv, das dann wirklich
# daliegt.
#
# Am 04.10.2026 ging bei DocuSort eine Fassung an Roberts Kunden, die auf
# bestehenden Datenbanken nicht startete: `:latest` wanderte beim Push, geprueft
# worden war nur ein lokal gebautes Abbild. Seine Anweisung daraus gilt fuer
# saemtliche oeffentlichen Repos.
#
# Reihenfolge jetzt:
#   1. Tag-Push       ->  Release als VORABFASSUNG. `releases/latest` zeigt
#                         weiter auf die vorige — das README-Ziel bleibt heil.
#   2. dieser Schritt ->  das veroeffentlichte `aiwerkstatt-<v>.tar.gz` wird
#                         geholt, ausgepackt, nachgelesen, uebersetzt und noch
#                         einmal auf Lecks durchsucht — am ARTEFAKT, nicht am
#                         Arbeitsstand.
#   3. erst dann      ->  Release wird regulaer und ist „latest".
name: Promote to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Die Version, z. B. 0.11.0 (ohne v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Das veroeffentlichte Archiv holen und nachlesen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          TAG="v$V"
          ARCHIV="aiwerkstatt-${V}.tar.gz"
          mkdir -p pruefung && cd pruefung
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIV"
          ls -l "$ARCHIV"

          fehler=0
          rm -rf aus && mkdir aus
          if ! tar xzf "$ARCHIV" -C aus; then
            echo "  🔴 laesst sich nicht auspacken"
            exit 1
          fi
          BAUM="aus/aiwerkstatt-${V}"
          if [ ! -d "$BAUM" ]; then
            echo "  🔴 im Archiv liegt kein Verzeichnis aiwerkstatt-${V}"
            ls aus
            exit 1
          fi
          echo "  OK  ausgepackt nach $BAUM"

          # Die Fassung, die drin steht, muss die sein, die draufsteht.
          drin="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$BAUM/pyproject.toml" | head -1)"
          if [ "$drin" = "$V" ]; then
            echo "  OK  es ist wirklich $V"
          else
            echo "  🔴 drin steht ${drin:-nichts}, drauf steht $V"
            fehler=1
          fi

          # 🔑 Ein Syntaxfehler macht jede Installation beim ersten Start tot —
          # und das faellt sonst erst beim Benutzer auf.
          if python3 -m compileall -q "$BAUM/backend" > /tmp/compile.log 2>&1; then
            echo "  OK  der Rumpf uebersetzt sich"
          else
            echo "  🔴 uebersetzt sich nicht:"
            tail -20 /tmp/compile.log
            fehler=1
          fi

          # 🔴 Der Leck-Scan noch einmal, aber am AUSGEPACKTEN ARCHIV. Oben im
          # Bau laeuft er auf dem Checkout — das ist nicht dieselbe Datei. Was
          # `git archive` wirklich mitgenommen hat, sieht man nur hier.
          if ( cd "$BAUM" && python3 backend/scrub/scan.py . ); then
            echo "  OK  kein Leck im veroeffentlichten Archiv"
          else
            echo "  🔴 der Leck-Scan findet etwas IM ARCHIV"
            fehler=1
          fi

          if [ "$fehler" != "0" ]; then
            echo "🔴 NICHT FREIGEBEN"
            exit 1
          fi
          echo "✅ das veroeffentlichte Archiv ist heil"

      - name: Das Release regulaer machen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "::notice::$TAG ist jetzt die regulaere Fassung"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isLatest
