name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Blocks the build on any secret / private-data finding (0 blocking required).
      - name: Leak scan
        run: python backend/scrub/scan.py .

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan walks the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit==2.10.1
      - name: Gate tests
        run: python -m unittest discover -s scripts/security-gate
      # Red on critical/high dependency findings and on any secret ever committed
      # (exceptions: security-exceptions.json, reason + expiry mandatory).
      - name: Security gate
        run: python scripts/security-gate/security_gate.py check . --json security-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gate
          path: security-gate.json

  cli-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claude CLI pin matches pyproject
        run: |
          v=$(grep -E '^claude_cli *=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          grep -q "@anthropic-ai/claude-code@$v" agent-runner/Dockerfile

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile backend + agent-runner
        run: |
          python -m py_compile backend/*.py backend/providers/*.py backend/scrub/*.py
          python -m py_compile agent-runner/*.py agent-runner/providers/*.py scripts/chain/*.py scripts/test-runner/*.py scripts/branch-check/*.py scripts/security-gate/*.py scripts/release-check/*.py
      # Without the docker package the orchestrator runs without a Docker client, so the
      # tests need no Docker daemon on the runner.
      - name: Backend tests
        run: |
          python -m pip install --quiet $(grep -E '^(Flask|requests)==' backend/requirements.txt)
          cd backend && python -m unittest discover -s tests
      - name: Chain tool tests
        run: python -m unittest discover -s scripts/chain
      - name: Remote test runner tests
        run: python -m unittest discover -s scripts/test-runner
      - name: Branch check tests
        run: python -m unittest discover -s scripts/branch-check
      - name: Release check tests
        run: python -m unittest discover -s scripts/release-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
