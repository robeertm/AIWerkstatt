name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Blocks the build on any secret / private-data finding (0 blocking required).
      - name: Leak scan
        run: python backend/scrub/scan.py .

  cli-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claude CLI pin matches pyproject
        run: |
          v=$(grep -E '^claude_cli *=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          grep -q "@anthropic-ai/claude-code@$v" agent-runner/Dockerfile

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile backend + agent-runner
        run: |
          python -m py_compile backend/*.py backend/providers/*.py backend/scrub/*.py
          python -m py_compile agent-runner/*.py agent-runner/providers/*.py
      # Without the docker package the orchestrator runs without a Docker client, so the
      # tests need no Docker daemon on the runner.
      - name: Backend tests
        run: |
          python -m pip install --quiet $(grep -E '^(Flask|requests)==' backend/requirements.txt)
          cd backend && python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
